services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: recoia
      POSTGRES_USER: recoia
      POSTGRES_PASSWORD: recoia
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recoia -d recoia"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    environment:
      RECOIA_DATABASE_URL: postgresql+psycopg://recoia:recoia@postgres:5432/recoia
      RECOIA_ARTIFACTS_DIR: /app/artifacts
      RECOIA_ACTIVE_VERSION: demo
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
